name: Release

# A pushed version tag is the only event that can publish a GitHub Release.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check version, formatting, and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Reject tags that don't match Cargo.toml
        run: python scripts/package_release.py --tag "$GITHUB_REF_NAME" --check-only
      - name: Verify cargo-binstall metadata matches release artifacts
        run: python scripts/test_binstall_metadata.py
      - name: Test Homebrew formula generation
        run: python scripts/test_homebrew_formula.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    name: Build and test (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # The target-specific C compiler is needed for Tree-sitter's C grammars.
      # Compile Tree-sitter's C code with musl, but leave the final Rust
      # linker under rustc's control. Forcing musl-gcc as the final linker can
      # produce a broken dynamic PIE with an ld-musl interpreter.
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install musl compiler
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Run native tests
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo test --locked --all-targets --all-features
      - name: Run statically linked Linux tests
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --locked --all-targets --all-features --target x86_64-unknown-linux-musl
      - name: Compile release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify the Linux musl binary has no dynamic dependencies
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/x86_64-unknown-linux-musl/release/jerc"
          readelf -h "$binary" >/dev/null
          if readelf -l "$binary" | grep -q INTERP; then
            echo 'ERROR: musl executable has a dynamic loader' >&2
            exit 1
          fi
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo 'ERROR: musl executable requires shared libraries' >&2
            exit 1
          fi
      - name: Verify built version
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/jerc"
          if [[ "${{ matrix.target }}" == *windows* ]]; then binary+=".exe"; fi
          "$binary" --version | grep -F "${GITHUB_REF_NAME#v}"
      - name: Package binary and license
        shell: bash
        run: python scripts/package_release.py --tag "$GITHUB_REF_NAME" --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  homebrew_formula:
    name: Generate checksum-pinned Homebrew formula
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*-apple-darwin
          path: dist
          merge-multiple: true
      - name: Render formula for both native macOS release archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-homebrew-formula.py \
            --tag "$GITHUB_REF_NAME" --archives dist \
            --output dist/homebrew/Formula/jerc.rb
          ruby -c dist/homebrew/Formula/jerc.rb
          tar -czf "dist/jerc-homebrew-${GITHUB_REF_NAME}.tar.gz" \
            -C dist/homebrew Formula
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: dist/jerc-homebrew-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  homebrew_smoke:
    name: Homebrew install (${{ matrix.name }})
    needs: [build, homebrew_formula]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-15-intel
            arch: x86_64
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*-apple-darwin
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify formula and install with Homebrew
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          brew --version
          mkdir -p "$RUNNER_TEMP/published"
          tar -xzf "dist/jerc-homebrew-${GITHUB_REF_NAME}.tar.gz" \
            -C "$RUNNER_TEMP/published"
          # The packaged formula MUST match the candidate release archives.
          python3 scripts/generate-homebrew-formula.py \
            --tag "$GITHUB_REF_NAME" --archives dist \
            --output "$RUNNER_TEMP/expected/Formula/jerc.rb"
          cmp "$RUNNER_TEMP/published/Formula/jerc.rb" "$RUNNER_TEMP/expected/Formula/jerc.rb"
          # GitHub Release URLs do not exist yet; install the exact archives
          # via a file:// URL while retaining identical SHA256 checksums.
          python3 scripts/generate-homebrew-formula.py \
            --tag "$GITHUB_REF_NAME" --archives dist --local-assets \
            --output "$RUNNER_TEMP/local/Formula/jerc.rb"
          ruby -c "$RUNNER_TEMP/local/Formula/jerc.rb"
          brew install --formula "$RUNNER_TEMP/local/Formula/jerc.rb"
          brew test "$RUNNER_TEMP/local/Formula/jerc.rb"
          "$(brew --prefix jerc)/bin/jerc" --version | grep -F "${GITHUB_REF_NAME#v}"

  deb:
    name: Package Debian/Ubuntu DEB
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install pinned nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build DEB from the verified Linux release archive
        run: ./scripts/package-linux-deb.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist/jerc_*.deb
          if-no-files-found: error
          retention-days: 7

  deb_smoke:
    name: Test DEB on ${{ matrix.name }}
    needs: deb
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian 13
            image: debian:trixie
          - name: Ubuntu 24.04 LTS
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deb-amd64
          path: dist
      - name: Install package and verify executable
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/scripts/smoke-linux-package.sh:/usr/local/bin/jerc-package-smoke:ro" \
            -e JERC_VERSION="${GITHUB_REF_NAME#v}" \
            -e JERC_PACKAGE_FORMAT=deb \
            -e JERC_PACKAGE_MANAGER=apt \
            "$DISTRO_IMAGE" bash /usr/local/bin/jerc-package-smoke

  rpm:
    name: Package and test Fedora 44 RPM
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install pinned nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build RPM from the verified Linux release archive
        run: ./scripts/package-linux-rpm.sh "$GITHUB_REF_NAME"
      - name: Install and smoke-test RPM on Fedora 44
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/dist:/packages:ro" \
            -e JERC_VERSION="${GITHUB_REF_NAME#v}" \
            quay.io/fedora/fedora:44 bash -euo pipefail -c '
              package="/packages/jerc-${JERC_VERSION}-1.x86_64.rpm"
              rpm -qp --qf "%{NAME} %{VERSION}-%{RELEASE} %{ARCH} %{LICENSE}\n" "$package"
              test "$(rpm -qp --qf "%{NAME}" "$package")" = jerc
              test "$(rpm -qp --qf "%{VERSION}-%{RELEASE}" "$package")" = "${JERC_VERSION}-1"
              test "$(rpm -qp --qf "%{ARCH}" "$package")" = x86_64
              test "$(rpm -qp --qf "%{LICENSE}" "$package")" = GPL-3.0-only
              rpm -qlp "$package" | grep -Fx /usr/bin/jerc
              rpm -qlp "$package" | grep -Fx /usr/share/licenses/jerc/LICENSE
              dnf install -y "$package"
              jerc --version | grep -F "$JERC_VERSION"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-x86_64
          path: dist/jerc-*.rpm
          if-no-files-found: error
          retention-days: 7

  opensuse_smoke:
    name: Test RPM on openSUSE Tumbleweed
    needs: rpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rpm-x86_64
          path: dist
      - name: Install package and verify executable
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/scripts/smoke-linux-package.sh:/usr/local/bin/jerc-package-smoke:ro" \
            -e JERC_VERSION="${GITHUB_REF_NAME#v}" \
            -e JERC_PACKAGE_FORMAT=rpm \
            -e JERC_PACKAGE_MANAGER=zypper \
            opensuse/tumbleweed:latest bash /usr/local/bin/jerc-package-smoke

  extra_packages:
    name: Package Alpine, Void and Gentoo formats
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: binary-x86_64-unknown-linux-musl
          path: dist
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install pinned nFPM
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - name: Package Alpine APK
        run: ./scripts/package-linux-apk.sh "$GITHUB_REF_NAME"
      - name: Package Void XBPS for glibc and musl
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e JERC_TAG="$GITHUB_REF_NAME" \
            ghcr.io/void-linux/void-musl-full:latest \
            sh -ec './scripts/package-linux-xbps.sh "$JERC_TAG"'
      - name: Build and verify Gentoo Portage overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package-linux-source.py "$GITHUB_REF_NAME"
          python3 scripts/generate-linux-source-recipes.py "$GITHUB_REF_NAME"
          tar -czf "dist/jerc-source-recipes-${GITHUB_REF_NAME}.tar.gz" -C dist source-recipes
          python3 scripts/package-linux-gentoo.py "$GITHUB_REF_NAME"
          python3 scripts/verify-gentoo-overlay.py "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: extra-linux-formats
          path: |
            dist/jerc-*.apk
            dist/jerc-*.xbps
            dist/jerc-gentoo-overlay-*.tar.gz
            dist/jerc-v*-vendored.tar.gz
            dist/jerc-source-recipes-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  extra_smoke:
    name: Test ${{ matrix.name }} package/runtime
    needs: extra_packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Alpine Linux
            image: alpine:3.22
            manager: apk
            xbps_arch: none
          - name: Void Linux glibc
            image: ghcr.io/void-linux/void-glibc-full:latest
            manager: xbps
            xbps_arch: x86_64
          - name: Void Linux musl
            image: ghcr.io/void-linux/void-musl-full:latest
            manager: xbps
            xbps_arch: x86_64-musl
          - name: Gentoo stage3 (overlay metadata and runtime)
            image: gentoo/stage3:latest
            manager: gentoo
            xbps_arch: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: extra-linux-formats
          path: dist
      - uses: actions/download-artifact@v4
        if: matrix.manager == 'gentoo'
        with:
          name: binary-x86_64-unknown-linux-musl
          path: dist
      - name: Install or execute package in target distribution
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          PKG_MANAGER: ${{ matrix.manager }}
          XBPS_ARCH: ${{ matrix.xbps_arch }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/dist:/packages:ro" \
            -v "$PWD/scripts/smoke-extra-linux-package.sh:/usr/local/bin/jerc-extra-smoke:ro" \
            -e JERC_VERSION="${GITHUB_REF_NAME#v}" \
            -e JERC_PACKAGE_MANAGER="$PKG_MANAGER" \
            -e JERC_XBPS_ARCH="$XBPS_ARCH" \
            "$DISTRO_IMAGE" sh /usr/local/bin/jerc-extra-smoke

  publish:
    name: Publish GitHub Release
    needs: [build, rpm, deb, deb_smoke, opensuse_smoke, extra_packages, extra_smoke, homebrew_formula, homebrew_smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          # Four platform archives, five packages, Gentoo overlay, two source assets, and Homebrew formula.
          path: dist
          merge-multiple: true
      - name: Create SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum jerc-* jerc_*.deb > SHA256SUMS
          test "$(find . -maxdepth 1 -type f \( -name 'jerc-*' -o -name 'jerc_*.deb' \) | wc -l)" -eq 13
      - name: Publish tagged release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Jerc $GITHUB_REF_NAME" \
            --generate-notes
      - name: Start AUR release publishing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # repository_dispatch is allowed to trigger a workflow with GITHUB_TOKEN.
          # A release.published event generated with that token is suppressed.
          gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=jerc_release_ready \
            -f "client_payload[tag]=$GITHUB_REF_NAME"

  publish_crate:
    name: Publish Jerc to crates.io
    needs: publish
    runs-on: ubuntu-24.04
    # Configure the matching trusted publisher on crates.io after the first
    # manual publication. A tag push is an accepted trusted-publishing event.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify tag and binary-release manifest
        run: |
          python scripts/package_release.py --tag "$GITHUB_REF_NAME" --check-only
          python scripts/test_binstall_metadata.py
      - name: Skip versions already on crates.io
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_crates_io_version.py --version "${GITHUB_REF_NAME#v}"
      - name: Validate publishable crate from the tagged source
        if: steps.registry.outputs.publish == 'true'
        run: cargo publish --dry-run --locked
      - name: Authenticate using crates.io Trusted Publishing
        if: steps.registry.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        if: steps.registry.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
