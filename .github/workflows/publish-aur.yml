name: Publish AUR packages

on:
  # Manual GitHub Releases trigger this event. Releases created by GITHUB_TOKEN
  # don't, so release.yml also sends a repository_dispatch below.
  release:
    types: [published]
  repository_dispatch:
    types: [jerc_release_ready]
  # Package-only changes should be published without a new GitHub release.
  push:
    branches: [main]
    paths:
      - 'packaging/aur/*/PKGBUILD'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.6.1)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: jerc-aur-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    # Explicit SSH configuration: OpenSSH may ignore $HOME in a job container.
    # Never disable host-key verification for a release-publishing workflow.
    env:
      GIT_SSH_COMMAND: >-
        ssh -F /dev/null
        -i /tmp/jerc-aur-ssh/id_ed25519
        -o IdentitiesOnly=yes
        -o BatchMode=yes
        -o StrictHostKeyChecking=yes
        -o UserKnownHostsFile=/tmp/jerc-aur-ssh/known_hosts
        -o GlobalKnownHostsFile=/dev/null
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh curl jq

      - name: Check out packaging sources
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Configure and verify AUR SSH authentication
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$AUR_SSH_PRIVATE_KEY" && -n "$AUR_SSH_KNOWN_HOSTS" ]] || {
            echo 'Missing AUR_SSH_PRIVATE_KEY or AUR_SSH_KNOWN_HOSTS secret' >&2
            exit 1
          }
          ssh_dir=/tmp/jerc-aur-ssh
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/id_ed25519" >/dev/null || {
            echo 'AUR_SSH_PRIVATE_KEY is not a valid unencrypted SSH private key' >&2
            exit 1
          }
          ssh-keygen -F aur.archlinux.org -f "$ssh_dir/known_hosts" >/dev/null || {
            echo 'AUR_SSH_KNOWN_HOSTS has no entry for aur.archlinux.org' >&2
            exit 1
          }
          ssh -F /dev/null -i "$ssh_dir/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            aur@aur.archlinux.org help > /dev/null
          echo 'Verified AUR host identity and CI key authentication'

      - name: Resolve GitHub Release tag
        id: release_tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name || github.event.client_payload.tag || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$EVENT_TAG" ]]; then
            tag="$EVENT_TAG"
          else
            # For a packaging-only push, reuse the latest published release.
            tag="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
              | jq -er '.tag_name')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid or missing GitHub release tag: $tag" >&2
            exit 1
          }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          echo "Preparing AUR packages for $tag"

      - name: Test automatic pkgrel versioning
        run: ./scripts/test-aur-pkgrel.sh

      - name: Generate release PKGBUILDs and .SRCINFO
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          # makepkg refuses to run as root, even when printing metadata.
          useradd --create-home aur-builder
          chown -R aur-builder:aur-builder packaging/aur
          runuser -u aur-builder -- ./scripts/update-aur-release.sh "$RELEASE_TAG"

      - name: Commit packaging metadata to GitHub
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for name in jerc-bin jerc; do
            if [[ -f "packaging/aur/$name/PKGBUILD" ]]; then
              git add "packaging/aur/$name/PKGBUILD"
              git add -f "packaging/aur/$name/.SRCINFO"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update AUR packages for $RELEASE_TAG"
            git push origin HEAD:main
          fi

      - name: Publish binary package to AUR
        env:
          GIT_AUTHOR_NAME: HiFiveJazz
          GIT_AUTHOR_EMAIL: aur@users.noreply.github.com
          GIT_COMMITTER_NAME: HiFiveJazz
          GIT_COMMITTER_EMAIL: aur@users.noreply.github.com
        run: ./scripts/publish-aur.sh jerc-bin

      # The source package must compile and pass its check() tests before
      # it can be submitted or updated on the AUR.
      - name: Build and test source AUR package
        if: ${{ vars.AUR_PUBLISH_SOURCE == 'true' }}
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed rust cargo ca-certificates
          # makepkg refuses root; the metadata step created this user and
          # gave it ownership of packaging/aur.
          runuser -u aur-builder -- bash -c '
            set -euo pipefail
            cd packaging/aur/jerc
            makepkg --cleanbuild --noconfirm
          '

      - name: Publish source package to AUR (opt-in)
        if: ${{ vars.AUR_PUBLISH_SOURCE == 'true' }}
        env:
          GIT_AUTHOR_NAME: HiFiveJazz
          GIT_AUTHOR_EMAIL: aur@users.noreply.github.com
          GIT_COMMITTER_NAME: HiFiveJazz
          GIT_COMMITTER_EMAIL: aur@users.noreply.github.com
        run: ./scripts/publish-aur.sh jerc
