# RPM package created from the verified static musl GitHub Release archive.
name: jerc
arch: amd64
platform: linux
version: ${JERC_VERSION}
release: 1
maintainer: HiFiveJazz
homepage: https://github.com/HiFiveJazz/jerc
license: GPL-3.0-only
description: Keyboard-driven terminal email client written in Rust
# TLS uses the host's trusted CA certificate store.
depends:
  - ca-certificates
contents:
  - src: dist/rpm-stage/jerc
    dst: /usr/bin/jerc
    file_info:
      mode: 0755
  - src: dist/rpm-stage/LICENSE
    dst: /usr/share/licenses/jerc/LICENSE
    file_info:
      mode: 0644
  - src: dist/rpm-stage/README.md
    dst: /usr/share/doc/jerc/README.md
    file_info:
      mode: 0644
  - src: dist/rpm-stage/config.example.toml
    dst: /usr/share/doc/jerc/config.example.toml
    file_info:
      mode: 0644
