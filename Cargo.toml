[package]
name = "aerc-rs"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
description = "A fast, backend-oriented terminal email client inspired by aerc"
license = "MIT"
publish = false

[dependencies]
html2text = { version = "0.17.1", features = ["css"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", default-features = false, features = ["events"] }
dirs = "6"
io-imap = { version = "0.7.1", default-features = false, features = ["rustls-ring"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "rustls-platform-verifier"] }
mail-parser = { version = "1.0", features = ["full_encoding"] }
percent-encoding = "2.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty"] }

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", default-features = false, features = ["windows"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
