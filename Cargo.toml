[package]
name = "jerc"
version = "0.6.3"
edition = "2024"
rust-version = "1.98"
description = "A keyboard-driven terminal email client written in Rust"
license = "GPL-3.0-only"
repository = "https://github.com/HiFiveJazz/jerc"
readme = "README.md"
keywords = ["email", "terminal", "tui", "imap", "smtp"]
categories = ["command-line-utilities"]

# cargo-binstall uses the release artifacts built by release.yml.
# Linux GNU hosts get the existing fully static musl binary.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-v{ version }-x86_64-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

# Normal release builds retain full syntax-aware patch previews.
# Use --no-default-features to omit the Tree-sitter grammars for a smaller binary.
[features]
default = ["patch-syntax"]
patch-syntax = ["dep:tree-sitter", "dep:tree-sitter-c", "dep:tree-sitter-rust"]

[dependencies]
html2text = { version = "0.17.4", features = ["css"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
dirs = "7.0.0"
io-imap = { version = "0.8.1", default-features = false, features = ["rustls-ring"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls", "ring", "rustls-platform-verifier"] }
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
percent-encoding = "2.3.2"
roxmltree = "0.21.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ring = "0.17.4" # already used transitively by TLS; PKCE SHA-256 and secure random
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tree-sitter = { version = "0.27.2", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
toml = "1.2.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
ureq = { version = "=3.5.1", features = ["json"] }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["use-dev-tty"] }

[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
